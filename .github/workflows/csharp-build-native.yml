name: 'C#: Build native library'

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      artifact-name:
        required: true
        type: string

jobs:
  build-native:
    runs-on: ${{ inputs.runner }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6
        with:
          clean: true

      - name: Install system dependencies
        run: |
          if [[ $RUNNER_OS == 'Linux' ]]; then
            sudo apt-get update && sudo apt-get install -y swig cmake build-essential
          elif [[ $RUNNER_OS == 'macOS' ]]; then
            brew install swig cmake
          else
            # The Windows runner ships Visual Studio, CMake and git.
            choco install swig --no-progress -y
          fi
          swig -version

      # Builds libblsct from the shared pin (ffi/navio-core.sha) and links the
      # SWIG C# wrapper against it: blsct.dll with MSVC on Windows,
      # libblsct.so / libblsct.dylib elsewhere.
      - name: Build native library
        run: ./ffi/csharp/build-native.sh

      - name: Upload native library
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: ffi/csharp/native/out/*
          if-no-files-found: error
