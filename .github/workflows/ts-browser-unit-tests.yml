name: 'TypeScript Browser: Run WASM unit tests'

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths:
      - 'ffi/blsct.i'
      - 'ffi/navio-core.sha'
      - 'ffi/ts/navio-core.sha'
      - 'ffi/ts/patches/**'
      - 'ffi/ts/src/**'
      - 'ffi/ts/scripts/**'
      - '.github/workflows/ts-browser-unit-tests.yml'
  pull_request:
    paths:
      - 'ffi/blsct.i'
      - 'ffi/navio-core.sha'
      - 'ffi/ts/navio-core.sha'
      - 'ffi/ts/patches/**'
      - 'ffi/ts/src/**'
      - 'ffi/ts/scripts/**'
      - '.github/workflows/ts-browser-unit-tests.yml'


jobs:
  run-ts-browser-unit-tests:
    strategy:
      matrix:
        os: ['ubuntu-24.04', 'macos-15']

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          clean: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: '5.0.0'
          actions-cache-folder: 'emsdk-cache-v5'

      - name: Verify Emscripten installation
        run: emcc --version

      - name: Install dependencies
        run: |
          cd ffi/ts
          npm install --ignore-scripts

      - name: Build WASM module
        run: |
          cd ffi/ts
          npm run build:wasm

      - name: Build TypeScript (browser)
        run: |
          cd ffi/ts
          npm run build:browser

      - name: Run browser tests
        run: |
          cd ffi/ts
          npm run test:browser
