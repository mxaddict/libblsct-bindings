name: 'C#: Publish package'

on:
  workflow_dispatch:
  push:
    paths:
      - 'ffi/blsct.i'
      - '.github/actions/libblsct/**'
      - 'ffi/navio-core.sha'
      - 'ffi/csharp/**'
      - '.github/workflows/csharp-publish-pkg.yml'
      - '.github/workflows/csharp-build-native.yml'
  pull_request:
    paths:
      - 'ffi/blsct.i'
      - '.github/actions/libblsct/**'
      - 'ffi/navio-core.sha'
      - 'ffi/csharp/**'
      - '.github/workflows/csharp-publish-pkg.yml'
      - '.github/workflows/csharp-build-native.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
            lib: libblsct.so
          - os: macos-15
            rid: osx-arm64
            lib: libblsct.dylib
          - os: windows-2022
            rid: win-x64
            lib: blsct.dll

    uses: ./.github/workflows/csharp-build-native.yml
    with:
      runner: ${{ matrix.os }}
      artifact-name: native-${{ matrix.rid }}

  pack:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          clean: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install SWIG
        # apt's SWIG (4.2.0) predates the C# typemaps blsct.i needs.
        run: |
          pipx install 'swig>=4.3'
          swig -version

      - name: Download native artifacts
        uses: actions/download-artifact@v8
        with:
          path: ffi/csharp/runtimes

      - name: Arrange runtimes
        run: |
          cd ffi/csharp/runtimes
          for dir in native-*; do
            rid="${dir#native-}"
            mkdir -p "$rid/native"
            mv "$dir"/* "$rid/native/"
            rmdir "$dir"
          done

      - name: Pack
        run:
          dotnet pack NavioBlsct.csproj --configuration Release --output ./nupkg
        working-directory: ffi/csharp

      - name: Verify package contents
        run: |
          unzip -l ./ffi/csharp/nupkg/*.nupkg | grep 'runtimes/.*/native/'

      - name: Upload nupkg artifact
        uses: actions/upload-artifact@v7
        with:
          name: navioblsct-nupkg
          path: ffi/csharp/nupkg/*.nupkg

  verify:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest', 'macos-15', 'windows-2022']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6
        with:
          clean: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Download nupkg artifact
        uses: actions/download-artifact@v8
        with:
          name: navioblsct-nupkg
          path: ffi/csharp/nupkg

      - name: Smoke test package in consumer app
        run: |
          SMOKE_DIR="${RUNNER_TEMP}/navioblsct-package-smoke"
          rm -rf "$SMOKE_DIR"
          mkdir -p "$SMOKE_DIR"
          cd "$SMOKE_DIR"
          dotnet new console -n PackageSmoke --framework net8.0 >/dev/null
          cd PackageSmoke
          VERSION=$(dotnet msbuild "$GITHUB_WORKSPACE/ffi/csharp/NavioBlsct.csproj" -nologo -getProperty:Version | tr -d '\r')
          dotnet add package NavioBlsct --version "$VERSION" --source "$GITHUB_WORKSPACE/ffi/csharp/nupkg" >/dev/null
          cat > Program.cs <<'EOF'
          using System;
          using NavioBlsct;

          blsct.init();
          Console.WriteLine(blsct.get_blsct_chain());
          EOF
          dotnet run

  publish:
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Download nupkg artifact
        uses: actions/download-artifact@v8
        with:
          name: navioblsct-nupkg
          path: ffi/csharp/nupkg

      - name: Publish to NuGet
        run: |
          dotnet nuget push ./ffi/csharp/nupkg/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
