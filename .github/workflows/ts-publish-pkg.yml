name: 'TypeScript: Publish package'

on:
  workflow_dispatch:
  push:
    paths:
      - 'ffi/blsct.i'
      - '.github/actions/libblsct/**'
      - 'ffi/ts/**'
      - '.github/workflows/ts-publish-pkg.yml'
  pull_request:
    paths:
      - 'ffi/blsct.i'
      - '.github/actions/libblsct/**'
      - 'ffi/ts/**'
      - '.github/workflows/ts-publish-pkg.yml'


jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v6
        with:
          clean: true

      # navio-core's libblsct, built once per runner image and pin and shared
      # by every binding through the Actions cache (sets BLSCT_PREBUILT_DIR).
      - name: Build or restore libblsct
        uses: ./.github/actions/libblsct

      - name: Install system dependencies
        run: |
          brew install cmake pkg-config git
          # Pin SWIG 4.5.0: the committed ffi/ts/swig/blsct_wrap.cxx is
          # regenerated with SWIG 4.5.0 (V8 API compat for Node 24+).
          # Homebrew's `swig` formula may lag behind, so install via pip
          # into a fixed prefix and put it on PATH for every step.
          python3 -m pip install --user --quiet --break-system-packages 'swig==4.5.0' || python3 -m pip install --user --quiet 'swig==4.5.0'
          SWIG_BIN="$(python3 -m site --user-base)/bin"
          echo "$SWIG_BIN" >> "$GITHUB_PATH"
          export PATH="$SWIG_BIN:$PATH"
          which swig && swig -version | head -1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: '5.0.0'
          actions-cache-folder: 'emsdk-cache-v5'

      - name: Verify Emscripten installation
        run: emcc --version

      - name: Install dependencies and build native module
        run: |
          cd ffi/ts
          npm install
        env:
          BLSCT_REGENERATE_SWIG: '1'

      - name: Build WASM module
        run: |
          cd ffi/ts
          npm run build:wasm

      - name: Build browser TypeScript
        run: |
          cd ffi/ts
          npm run build:browser

      - name: Run native tests
        run: |
          cd ffi/ts
          npm test

      - name: Pack
        run: |
          mkdir -p /tmp/ts-pkg
          cd ffi/ts
          npm pack --pack-destination /tmp/ts-pkg

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ts-pkg
          path: /tmp/ts-pkg/*.tgz

  verify:
    needs: build
    strategy:
      matrix:
        # Windows is omitted: scripts/build.js (run by the package's npm
        # install hook) only supports Linux and Darwin. Browser/WASM
        # consumers on Windows go through bundlers, not direct npm install.
        # Node 24 is included because its V8 removed the old SWIG wrapper
        # APIs (Holder/WriteUtf8) — regression guard for the wrapper.
        os: ['ubuntu-24.04', 'macos-15']
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Install system dependencies
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y build-essential cmake pkg-config python3
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install cmake pkg-config
          fi

      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: ts-pkg
          path: ts-pkg

      - name: Smoke test package
        run: |
          SMOKE_DIR="${RUNNER_TEMP}/ts-pkg-smoke"
          mkdir -p "$SMOKE_DIR" && cd "$SMOKE_DIR"
          npm init -y
          npm install "$GITHUB_WORKSPACE"/ts-pkg/*.tgz
          node -e "
            const { getChain, Bech32 } = require('@nav-io/navio-blsct');
            const chain = getChain();
            console.log('chain:', chain);
            console.log('Bech32:', Bech32);
          "

  publish:
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    # OIDC trusted publishing (same mechanism as nav-io/navio-sdk). Replaces
    # the classic NODE_AUTH_TOKEN, which was returning E404 on publish.
    # Requires navio-blsct to have a trusted publisher configured on npm
    # pointing at this repo + workflow.
    permissions:
      id-token: write

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org/'

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: ts-pkg
          path: /tmp/ts-pkg

      - name: Publish to npm with provenance
        run: npm publish /tmp/ts-pkg/*.tgz --access public --provenance
