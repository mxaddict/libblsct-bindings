name: 'TypeScript: Run unit tests'

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths:
      - 'ffi/blsct.i'
      - 'ffi/ts/**'
      - '.github/workflows/ts-unit-tests.yml'
  pull_request:
    paths:
      - 'ffi/blsct.i'
      - 'ffi/ts/**'
      - '.github/workflows/ts-unit-tests.yml'


jobs:
  ts-run-unit-tests:
    strategy:
      matrix:
        os: ['ubuntu-24.04', 'macos-15', 'windows-2022']

    runs-on: ${{ matrix.os }}

    steps:
      - name: Install system dependencies
        # The Windows runner ships Visual Studio, CMake and git already.
        if: runner.os != 'Windows'
        run: |
          if [[ $RUNNER_OS == 'Linux' ]]; then
            sudo apt-get update && sudo apt-get install -y swig autoconf automake libtool pkg-config git python3 build-essential cmake
          elif [[ $RUNNER_OS == 'macOS' ]]; then
            brew install swig autoconf automake libtool pkg-config git cmake
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: actions/checkout@v6
        with:
          clean: true

      - name: Build blsct.node
        run: |
          cd ffi/ts
          npm install

      - name: Run tests
        run: |
          cd ffi/ts
          npx jest
