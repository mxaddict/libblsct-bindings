name: 'Python: Run unit tests'

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths:
      - 'ffi/blsct.i'
      - '.github/actions/libblsct/**'
      - 'ffi/navio-core.sha'
      - 'ffi/python/**'
      - '.github/workflows/python-unit-tests.yml'
      - '!.pytest_cache/**'
      - '!dist/**'
      - '!docs/**'
      - '!navio-core/**'
      - '!navio_blsct.egg-info/**'
      - '!venv/**'
  pull_request:
    paths:
      - 'ffi/blsct.i'
      - '.github/actions/libblsct/**'
      - 'ffi/navio-core.sha'
      - 'ffi/python/**'
      - '.github/workflows/python-unit-tests.yml'
      - '!.pytest_cache/**'
      - '!dist/**'
      - '!docs/**'
      - '!navio-core/**'
      - '!navio_blsct.egg-info/**'
      - '!venv/**'


jobs:
  python-run-unit-tests:
    strategy:
      # Each OS is its own verdict: one red leg must not cancel the others.
      fail-fast: false
      matrix:
        os: ['ubuntu-24.04', 'macos-15', 'windows-2022']
        python-version: ['3.12']

    runs-on: ${{ matrix.os }}

    steps:
      - name: Install system dependencies
        shell: bash
        run: |
          if [[ $RUNNER_OS == 'Linux' ]]; then
            sudo apt-get update && sudo apt-get install -y swig cmake pkg-config
          elif [[ $RUNNER_OS == 'macOS' ]]; then
            brew install swig cmake pkg-config
          elif [[ $RUNNER_OS == 'Windows' ]]; then
            choco install swig --no-progress -y
            swig -version
          fi

      - name: Configure MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: macOS SDK setup
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcode-select -p
          xcrun --show-sdk-path
          clang --version

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          pip install setuptools build pytest

      - uses: actions/checkout@v6
        with:
          clean: true

      # navio-core's libblsct, built once per runner image and pin and shared
      # by every binding through the Actions cache (sets BLSCT_PREBUILT_DIR).
      - name: Build or restore libblsct
        uses: ./.github/actions/libblsct

      - name: Build and install the package
        shell: bash
        run: |
          cd ffi/python
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            export SDKROOT="$(xcrun --show-sdk-path)"
            export CPPFLAGS="-isysroot $SDKROOT"
            export CFLAGS="-isysroot $SDKROOT"
            export CXXFLAGS="-isysroot $SDKROOT"
          fi
          python -m build
          pip install dist/*.whl

      - name: Run tests
        shell: bash
        run: |
          cd ffi/python
          pytest tests
